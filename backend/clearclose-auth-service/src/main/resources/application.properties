

# Application Configuration
spring.application.name=clearclose-auth-service
server.port=8081
logging.level.org.springframework.security=TRACE



spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=757846
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ==========================================
# SPRING DATA JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# JWT CONFIGURATION
# ==========================================

# Set JWT_SECRET to a secret of at least 32 characters
app.jwt.secret=b8238cb359b7c6361f3b312f24dc8b8c
app.jwt.expiration-minutes=60


# ==========================================
# DEMO OFFICER CONFIGURATION
# ==========================================

# app.demo.seed-officers=true
#app.demo.seed-borrowers=true
app.demo.seed-all=true
# app.demo.officer-password=DemoOfficer@123

app.demo.seed-officers=${DEMO_SEED_OFFICERS:false}
app.demo.officer-password=${DEMO_OFFICER_PASSWORD:}


# ==========================================
# EUREKA CLIENT CONFIGURATION
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

server.error.include-message=always
server.error.include-stacktrace=always
# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO
logging.level.com.clearclose.auth=DEBUG
logging.level.org.hibernate.SQL=DEBUG