# ==========================================
# CLEARCLOSE - EXIT SERVICE
# ==========================================

spring.application.name=clearclose-exit-service

# Cooling-off processing fees are read from the loan's LOAN_PRODUCT_RULE row.
server.port=8083

# Final completion calls LoanAccount directly with a separate service JWT.
clearclose.loan-account.base-url=${LOAN_ACCOUNT_SERVICE_URL:http://localhost:8085}
clearclose.internal.exit-secret=XmixjzD75CRO2JYgoUhEstnbZLGTUGQw
clearclose.completion.retry-delay-ms=${FINAL_EXIT_RETRY_DELAY_MS:30000}
clearclose.completion.retry-batch-size=${FINAL_EXIT_RETRY_BATCH_SIZE:20}

# Payment and exit events share this service. Reuse an existing local broker.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.consumer.group-id=${PAYMENT_EVENT_GROUP:clearclose-exit-payment-v1}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=10
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.admin.fail-fast=false
clearclose.events.payment-topic=clearclose.payment.succeeded
clearclose.events.completion-topic=clearclose.loan-exit.completed
clearclose.events.payment-dlt=clearclose.payment.succeeded.DLT
clearclose.events.partitions=${KAFKA_EVENT_PARTITIONS:3}
clearclose.events.replicas=${KAFKA_EVENT_REPLICAS:1}
clearclose.events.listener-enabled=${PAYMENT_EVENT_LISTENER_ENABLED:true}

# Test keys only; supplied to the Java process environment, never to Vite.
