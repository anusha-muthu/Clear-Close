spring.application.name=Grievance
server.port=8099

# Must match the signing secret configured by Auth and the other JWT resource services.
app.jwt.secret=b8238cb359b7c6361f3b312f24dc8b8c

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=admin1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Kafka audit publishing is temporarily disabled for local development.
clearclose.audit.enabled=false
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

clearclose.audit.topic=clearclose.audit.events

logging.file.name=mylogs/grievance.log
logging.exception-conversion-word=%wEx
