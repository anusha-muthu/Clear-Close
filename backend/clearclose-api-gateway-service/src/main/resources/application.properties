spring.application.name=clearclose-api-gateway
# ==========================================
# CLEARCLOSE - API GATEWAY
# ==========================================

# Application Configuration

server.port=8080


# ==========================================
# DEFAULT FILTERS
# ==========================================

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials


# ==========================================
# AUTH SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


# ==========================================
# LOAN SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=loan-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/borrower/loans/**


# ==========================================
# EXIT SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=exit-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/cooling-off/**

spring.cloud.gateway.server.webflux.routes[3].id=exit-officer-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/officer/cooling-off/**,/api/officer/closure/**


# ==========================================
# PAYMENT SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**


# ==========================================
# GRIEVANCE SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[5].id=grievance-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/grievances/**,/api/officer/grievances/**


# ==========================================
# DOCUMENT SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[6].id=document-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/noc/**,/api/collateral/**,/api/collateral-release/**,/api/officer/collateral/**


# ==========================================
# LOAN ACCOUNT SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[7].id=loan-account-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/borrower/loan-accounts/**


# ==========================================
# AUDIT SERVICE
# ==========================================

spring.cloud.gateway.server.webflux.routes[8].id=audit-service
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:8089
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/audit/**


