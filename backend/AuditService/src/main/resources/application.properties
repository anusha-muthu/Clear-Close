spring.application.name=AuditService
server.port:8084

# Must match the JWT signing secret and issuer configured by Auth.
app.jwt.secret=b8238cb359b7c6361f3b312f24dc8b8c

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=757846
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=clearclose-audit-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.clearclose.dto.AuditEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.clearclose.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false

logging.file.name=mylogs/auditservice.log
logging.exception-conversion-word=%wEx
