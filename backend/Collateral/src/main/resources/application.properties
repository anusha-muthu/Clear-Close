spring.application.name=Collateral
server.port=8087

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=system
spring.datasource.password=admin1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Keep in sync with Auth. Set JWT_SECRET in the environment outside local development.
app.jwt.secret=${JWT_SECRET:b8238cb359b7c6361f3b312f24dc8b8c}

# Loan Account is called directly inside the backend; borrower JWT is forwarded by the client.
services.loanAccount.base-url=http://localhost:8085

# Kafka audit integration remains available but disabled until the broker is running.
clearclose.audit.enabled=false
clearclose.audit.topic=clearclose.audit.events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
